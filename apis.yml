name: Whova
kind: company
description: >-
  Whova is an award-winning all-in-one event management platform built around a
  mobile event app that carries the agenda, speaker profiles, attendee
  networking, live polls, and session Q&A, plus registration, ticketing, name
  badges, surveys, abstract/speaker management, and exhibitor/sponsor tools.
  Whova does NOT publish an open, self-serve developer API - there is no public
  developer portal, no documented REST reference, no OpenAPI definition, and no
  SDKs. Its only programmatic surface for organizers is a partner/CRM
  integration layer exposed through Zapier (triggers for attendee, order, and
  registrant changes plus a create/update-attendee action), reached from the
  organizer dashboard under Attendees > Integrations > CRM Integration, alongside
  prebuilt connectors to Eventbrite, Cvent, Constant Contact, RegFox,
  OpenReview, SharePoint/OneDrive, MailChimp, Wild Apricot, and Google Drive. The
  API entries below are logical, HONESTLY MODELED views of that integration
  surface (see endpointsModeled) - they are not sourced from a public Whova API
  reference, and no base URL, auth scheme, or endpoint paths are published by
  Whova.
